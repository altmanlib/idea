<!doctype html>

<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 16px;
    font-family: -apple-system, "PingFang SC", sans-serif; background: #1d1d1f; color: #eee;
    padding: 24px; box-sizing: border-box;
  }
  .stage { width: min(80vmin, 640px); aspect-ratio: 1; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px #0008; }
  .stage svg { width: 100%; height: 100%; display: block; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .bar button {
    border: 1px solid #555; background: #2a2a2d; color: #eee; border-radius: 999px;
    padding: 6px 14px; font-size: 14px; cursor: pointer;
  }
  .bar button[aria-pressed="true"] { background: #eee; color: #111; border-color: #eee; }
  .hint { font-size: 12px; color: #888; }
</style>

  .pop .halftone { display: inline; }
  .ink .seal { display: inline; }

<div class="bar"><button id="dl">下载当前 SVG</button></div>
<div class="hint">数字键 1–7 切换风格</div>

<script>
  const THEMES = [
    ["orig", "原图"],
    ["flat", "平涂写实"],
    ["line", "线稿"],
    ["pop", "波普"],
    ["ink", "水墨"],
    ["neon", "霓虹"],
    ["pixel", "像素"],
  ];
  const art = document.getElementById("art");
  const bar = document.getElementById("bar");

  function setTheme(name) {
    art.setAttribute("class", name);
    dl.disabled = name === "orig"; // exported SVG would reference an external image
    for (const b of bar.children) b.setAttribute("aria-pressed", b.dataset.theme === name);
    history.replaceState(null, "", "#" + name);
  }

  for (const [key, label] of THEMES) {
    const b = document.createElement("button");
    b.dataset.theme = key;
    b.textContent = label;
    b.onclick = () => setTheme(key);
    bar.append(b);
  }

  document.addEventListener("keydown", (e) => {
    const i = Number(e.key) - 1;
    if (THEMES[i]) setTheme(THEMES[i][0]);
  });

  // The SVG embeds its own stylesheet, so the exported file is self-contained
  const dl = document.getElementById("dl");
  dl.onclick = () => {
    const blob = new Blob([new XMLSerializer().serializeToString(art)], { type: "image/svg+xml" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `avatar-421-${art.getAttribute("class")}.svg`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const initial = location.hash.slice(1);
  setTheme(THEMES.some(([k]) => k === initial) ? initial : "orig");
</script>
