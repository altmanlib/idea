<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>herdr 快捷键入门 · 动画教程</title>
<style>
:root{
  --bg0:#1d2021;--bg:#282828;--bg1:#3c3836;--bg2:#504945;--bg3:#665c54;
  --fg:#ebdbb2;--fg2:#d5c4a1;--gray:#928374;--red:#fb4934;--green:#b8bb26;
  --yellow:#fabd2f;--blue:#83a598;--purple:#d3869b;--aqua:#8ec07c;--orange:#fe8019;
  --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg0);color:var(--fg);font-family:-apple-system,"PingFang SC","Source Han Sans SC","Microsoft YaHei",sans-serif;min-height:100vh}
header{padding:28px 40px 4px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:26px}
h1 b{color:var(--orange);font-family:var(--mono)}
header p{margin:0;color:var(--gray);font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;padding:16px 40px 24px;max-width:1400px}
@media(max-width:1000px){main{grid-template-columns:1fr;padding:16px}header{padding:20px 16px 4px}}

/* Terminal mock */
.window{background:var(--bg);border:1px solid var(--bg2);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px #0009}
.titlebar{height:30px;background:var(--bg1);display:flex;align-items:center;padding:0 12px;gap:8px;font:12px var(--mono);color:var(--gray)}
.titlebar i{width:12px;height:12px;border-radius:50%;display:inline-block}
.titlebar span{margin-left:auto;margin-right:auto;transform:translateX(-30px)}
.screen{height:440px;display:flex;font:13px/1.55 var(--mono);position:relative;overflow:hidden}
.sidebar{width:180px;flex:none;background:var(--bg0);border-right:1px solid var(--bg1);padding:10px 0;transition:width .35s ease,padding .35s ease;overflow:hidden;white-space:nowrap}
.sidebar.hidden{width:0;padding:10px 0;border-right:0}
.sidebar .hd{padding:0 12px 6px;color:var(--gray);font-size:11px;letter-spacing:1px}
.ws{padding:3px 12px;color:var(--fg2);transition:background .25s}
.ws.active{background:var(--bg1);color:var(--fg)}
.ws .n{color:var(--gray);margin-right:6px}
.agent{padding:0 12px 0 28px;color:var(--gray);font-size:12px}
.sd{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.sd.busy{background:var(--yellow);animation:blink 1s infinite}
.sd.done{background:var(--green)}
.sd.idle{background:var(--bg3)}
@keyframes blink{50%{opacity:.3}}
.content{flex:1;display:flex;flex-direction:column;min-width:0}
.tabs{height:26px;flex:none;display:flex;background:var(--bg0);border-bottom:1px solid var(--bg1)}
.tab{padding:2px 14px;color:var(--gray);border-right:1px solid var(--bg1);transition:all .25s}
.tab.active{background:var(--bg);color:var(--yellow)}
.panes{flex:1;display:flex;padding:5px;gap:5px;min-height:0}
.split{display:flex;flex:1;gap:5px;min-width:0;min-height:0}
.split.v{flex-direction:column}
.pane{flex:1;border:1px solid var(--bg2);border-radius:4px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;transition:border-color .25s,box-shadow .25s}
.pane.new{animation:pop .4s ease}
.pane.zoomed{animation:zoom .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
@keyframes zoom{from{transform:scale(.85);opacity:.5}}
.pane.focus{border-color:var(--yellow);box-shadow:0 0 0 1px #fabd2f55}
.pane .ph{font-size:11px;padding:0 8px;background:var(--bg1);color:var(--gray);transition:all .25s}
.pane.focus .ph{color:var(--bg0);background:var(--yellow)}
.pane .pb{padding:6px 8px;white-space:pre;overflow:hidden}
.status{height:22px;flex:none;background:var(--bg1);display:flex;align-items:center;padding:0 10px;gap:10px;font-size:12px;color:var(--gray)}
.mode{padding:0 8px;border-radius:3px;background:var(--bg2);color:var(--fg);transition:all .2s}
.mode.prefix{background:var(--orange);color:var(--bg0);font-weight:700}
.status .r{margin-left:auto}
.g{color:var(--green)}.y{color:var(--yellow)}.b{color:var(--blue)}.o{color:var(--orange)}.p{color:var(--purple)}.a{color:var(--aqua)}.m{color:var(--gray)}

/* Overlays */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1d2021cc;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bg);border:1px solid var(--yellow);border-radius:6px;padding:12px 16px;min-width:260px;animation:pop .25s ease}
.modal .mt{color:var(--yellow);margin-bottom:8px}
.mi{padding:2px 8px;border-radius:3px}
.mi.sel{background:var(--bg2);color:var(--yellow)}
.cheat{display:grid;grid-template-columns:auto auto auto auto;gap:3px 14px;font-size:12px}
.cheat .k{color:var(--orange);text-align:right}
.detached{position:absolute;inset:0;background:var(--bg);padding:14px;white-space:pre;animation:fade .25s ease}

/* Keys & caption */
.keys{height:84px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.grp{display:inline-flex;align-items:center;gap:6px;opacity:.35;transition:opacity .2s}
.grp.done,.grp.down{opacity:1}
.kc{min-width:46px;height:46px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;font:600 17px var(--mono);color:var(--fg);background:linear-gradient(var(--bg2),var(--bg1));border:1px solid var(--bg3);border-bottom-width:4px;border-radius:8px;transition:all .12s}
.grp.down .kc{transform:translateY(3px);border-bottom-width:1px;background:var(--orange);color:var(--bg0);border-color:var(--orange)}
.grp.done .kc{border-color:var(--orange)}
.plus{color:var(--gray)}
.then{color:var(--gray);font-size:13px}
.nokey{color:var(--gray);font-size:14px}
.caption{min-height:92px}
.caption h2{margin:0 0 6px;font-size:20px}
.caption h2 .idx{color:var(--orange);font-family:var(--mono);margin-right:8px}
.caption p{margin:0;color:var(--fg2);line-height:1.75;font-size:15px}
kbd,code{font:13px var(--mono);background:var(--bg1);border:1px solid var(--bg2);border-radius:4px;padding:1px 6px;color:var(--yellow)}
code{color:var(--aqua)}

.controls{display:flex;align-items:center;gap:10px;margin-top:12px}
.controls button{background:var(--bg1);color:var(--fg);border:1px solid var(--bg2);border-radius:6px;padding:6px 14px;font-size:14px;cursor:pointer}
.controls button:hover{border-color:var(--orange)}
.bar{flex:1;height:4px;background:var(--bg1);border-radius:2px;overflow:hidden}
.bar div{height:100%;background:var(--orange);transition:width .4s}
.hint{color:var(--gray);font-size:12px}

/* Step list */
aside h3{margin:0 0 10px;font-size:14px;color:var(--gray);font-weight:500}
aside ol{list-style:none;margin:0;padding:0}
aside li{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--fg2)}
aside li:hover{background:var(--bg)}
aside li.active{background:var(--bg1);color:var(--fg)}
aside li.active .t::before{content:"▸ ";color:var(--orange)}
aside li .k{font:12px var(--mono);color:var(--gray);white-space:nowrap}
footer{padding:0 40px 32px;color:var(--gray);font-size:12px}
</style>
</head>
<body>
<header>
  <h1><b>herdr</b> 快捷键入门</h1>
  <p><span id="count"></span> 步动画，带你掌握分屏、标签页、工作区与会话</p>
</header>
<main>
  <section>
    <div class="caption" id="caption"></div>
    <div class="window">
      <div class="titlebar"><i style="background:#fb4934"></i><i style="background:#fabd2f"></i><i style="background:#b8bb26"></i><span>herdr — ~/code/snippet</span></div>
      <div class="screen" id="screen">
        <div class="sidebar" id="sidebar"></div>
        <div class="content">
          <div class="tabs" id="tabs"></div>
          <div class="panes" id="panes"></div>
          <div class="status" id="status"></div>
        </div>
        <div id="overlay"></div>
      </div>
    </div>
    <div class="keys" id="keys"></div>
    <div class="controls">
      <button id="prev">◀ 上一步</button>
      <button id="play">⏸ 暂停</button>
      <button id="next">下一步 ▶</button>
      <div class="bar"><div id="progress"></div></div>
      <span class="hint">← → 切换 · 空格 播放/暂停</span>
    </div>
  </section>
  <aside>
    <h3>步骤</h3>
    <ol id="list"></ol>
  </aside>
</main>
<footer>键位来自 herdr 0.9.3 默认配置（<code>herdr --default-config</code>），前缀键默认 <kbd>Ctrl</kbd>+<kbd>B</kbd>。界面为示意图，实际以 <kbd>Ctrl</kbd>+<kbd>B</kbd> <kbd>?</kbd> 帮助页为准</footer>

<script>
// ---------- Layout model ----------
let uid = 0;
const P = (cmd, lines, state) => ({ t: 'p', id: ++uid, cmd, lines, state });
const tab = (name, root) => ({ name, root, focus: root.id, zoom: false });
const clone = (o) => structuredClone(o);
const curWs = (s) => s.ws[s.active];
const curTab = (s) => curWs(s).tabs[curWs(s).tab];
const firstPane = (n) => (n.t === 'p' ? n : firstPane(n.kids[0]));
const allPanes = (n) => (n.t === 'p' ? [n] : n.kids.flatMap(allPanes));
const findPane = (n, id) => allPanes(n).find((p) => p.id === id);

function replace(node, id, fn) {
  if (node.t === 'p') return node.id === id ? fn(node) : node;
  node.kids = node.kids.map((k) => replace(k, id, fn));
  return node;
}
// dir 'h' = side by side, 'v' = stacked
function split(s, dir, pane) {
  const t = curTab(s);
  t.root = replace(t.root, t.focus, (old) => ({ t: 's', dir, kids: [old, pane] }));
  t.focus = pane.id;
}
function parentOf(node, id) {
  if (node.t === 'p') return null;
  for (const k of node.kids) {
    if (k.t === 'p' && k.id === id) return node;
    const r = parentOf(k, id);
    if (r) return r;
  }
  return null;
}
function closeFocused(s) {
  const t = curTab(s);
  const parent = parentOf(t.root, t.focus);
  if (!parent) return;
  const sibling = parent.kids.find((k) => !(k.t === 'p' && k.id === t.focus));
  const prune = (n) => (n === parent ? sibling : n.t === 'p' ? n : ((n.kids = n.kids.map(prune)), n));
  t.root = prune(t.root);
  t.focus = firstPane(sibling).id;
}

const shell = (cwd = '~/code/snippet') => [`<span class="a">${cwd}</span> <span class="m">$</span> ▍`];
const s0 = {
  ws: [{ name: 'snippet', tabs: [tab('1', P('zsh', shell()))], tab: 0 }],
  active: 0, sidebar: true, overlay: null,
};

const CHEAT = [
  ['Ctrl+B', '前缀键'], ['?', '帮助'], ['V', '左右分屏'], ['-', '上下分屏'],
  ['H J K L', '移动焦点'], ['Tab', '循环窗格'], ['Z', '放大 / 还原'], ['X', '关闭窗格'],
  ['C', '新标签页'], ['N / P', '下 / 上一个标签'], ['1…9', '跳到第 N 个标签'], ['Shift+X', '关闭标签页'],
  ['Shift+N', '新建工作区'], ['W', '工作区选择器'], ['B', '侧边栏'], ['R', '调整大小模式'],
  ['Shift+D', '关闭工作区'], ['Q', '分离会话'],
];

// ---------- Steps ----------
const PB = ['Ctrl', 'B'];
const STEPS = [
  { title: '启动 herdr', keys: [],
    desc: '在终端里输入 <code>herdr</code> 启动或附加到持久会话。左边是侧边栏（工作区和 agent 状态），右边是标签页和窗格',
    apply: () => {} },
  { title: '认识前缀键', keys: [PB], holdPrefix: true,
    desc: '所有快捷键都分两步：先按 <kbd>Ctrl</kbd>+<kbd>B</kbd> 进入前缀模式，<b>松开</b>后再按动作键。用过 tmux 的话会很熟悉',
    apply: () => {} },
  { title: '左右分屏', keys: [PB, ['V']],
    desc: '<kbd>V</kbd> 竖直切一刀，新窗格出现在右边并获得焦点（黄色边框）。我们在里面跑一个 agent',
    apply: (s) => split(s, 'h', P('claude', ['<span class="o">✻</span> claude', '<span class="g">&gt;</span> 修复登录页的表单校验', '', '<span class="y">● Thinking…</span>'], 'busy')) },
  { title: '上下分屏', keys: [PB, ['-']],
    desc: '<kbd>-</kbd>（减号）水平切一刀，把当前窗格分成上下两块',
    apply: (s) => split(s, 'v', P('pi', ['<span class="b">π</span> pi', '<span class="g">&gt;</span> 补充单元测试', '', '<span class="y">● Running bun test…</span>'], 'busy')) },
  { title: '移动焦点', keys: [PB, ['H']],
    desc: '<kbd>H</kbd> <kbd>J</kbd> <kbd>K</kbd> <kbd>L</kbd> 分别聚焦 左 / 下 / 上 / 右 的窗格（Vim 方向）。<kbd>Tab</kbd> 按顺序循环',
    apply: (s) => { const t = curTab(s); t.focus = firstPane(t.root).id; } },
  { title: '放大窗格', keys: [PB, ['Z']],
    desc: '<kbd>Z</kbd> 让当前窗格临时占满全部区域，适合专心看一个窗格的输出',
    apply: (s) => { curTab(s).zoom = true; } },
  { title: '还原布局', keys: [PB, ['Z']],
    desc: '再按一次 <kbd>Z</kbd>，回到原来的分屏布局',
    apply: (s) => { curTab(s).zoom = false; } },
  { title: '新建标签页', keys: [PB, ['C']],
    desc: '<kbd>C</kbd>（create）新建标签页。每个标签页有自己独立的窗格布局',
    apply: (s) => { const w = curWs(s); w.tabs.push(tab(String(w.tabs.length + 1), P('zsh', shell()))); w.tab = w.tabs.length - 1; } },
  { title: '切换标签页', keys: [PB, ['P']],
    desc: '<kbd>P</kbd> 上一个，<kbd>N</kbd> 下一个；<kbd>1</kbd>…<kbd>9</kbd> 直接跳到第 N 个标签',
    apply: (s) => { curWs(s).tab = 0; } },
  { title: '新建工作区', keys: [PB, ['Shift', 'N']],
    desc: '工作区通常对应一个项目。<kbd>Shift</kbd>+<kbd>N</kbd> 新建，侧边栏多出一项',
    apply: (s) => { s.ws.push({ name: 'api', tabs: [tab('1', P('zsh', shell('~/code/api')))], tab: 0 }); s.active = s.ws.length - 1; } },
  { title: '工作区选择器', keys: [PB, ['W']],
    desc: '<kbd>W</kbd> 弹出工作区列表，项目多了以后用它跳转最快',
    apply: (s) => { s.overlay = { type: 'picker', sel: 1 }; } },
  { title: '选择并切换', keys: [['↑'], ['Enter']],
    during: { 0: (s) => { s.overlay.sel = 0; } },
    desc: '用 <kbd>↑</kbd> <kbd>↓</kbd> 选中目标，<kbd>Enter</kbd> 确认，回到 snippet 工作区',
    apply: (s) => { s.overlay = null; s.active = 0; } },
  { title: '隐藏侧边栏', keys: [PB, ['B']],
    desc: '<kbd>B</kbd> 折叠侧边栏，把空间让给窗格',
    apply: (s) => { s.sidebar = false; } },
  { title: '展开侧边栏', keys: [PB, ['B']],
    desc: '再按一次 <kbd>B</kbd> 展开。侧边栏里的圆点显示 agent 状态：<span class="y">●</span> 运行中，<span class="g">●</span> 已完成',
    apply: (s) => { s.sidebar = true; } },
  { title: '关闭窗格', keys: [PB, ['X']],
    desc: '<kbd>X</kbd> 关闭当前窗格，焦点移到相邻窗格。<kbd>Shift</kbd>+<kbd>X</kbd> 关闭标签页，<kbd>Shift</kbd>+<kbd>D</kbd> 关闭工作区',
    apply: closeFocused },
  { title: '查看帮助', keys: [PB, ['?']],
    desc: '记不住就按 <kbd>?</kbd>，列出全部快捷键。<kbd>Esc</kbd> 关闭',
    apply: (s) => { s.overlay = { type: 'help' }; } },
  { title: '分离会话', keys: [['Esc'], PB, ['Q']],
    during: { 0: (s) => { s.overlay = null; } },
    desc: '<kbd>Q</kbd> 分离（detach）：界面退出，但会话和 agent <b>继续在后台运行</b>，关掉终端也不影响',
    apply: (s) => { s.overlay = { type: 'detached', typed: '' }; } },
  { title: '重新附加', keys: [['Enter']], typeText: 'herdr',
    desc: '再次运行 <code>herdr</code>，回到离开时的布局。agent 在你离开期间已经跑完了',
    apply: (s) => {
      s.overlay = null;
      for (const w of s.ws) for (const t of w.tabs) for (const p of allPanes(t.root)) {
        if (p.cmd === 'pi') { p.state = 'done'; p.lines[3] = '<span class="g">✓ 12 tests passed</span>'; }
        if (p.cmd === 'claude') { p.state = 'done'; p.lines[3] = '<span class="g">✓ 已修复 2 个文件</span>'; }
      }
    } },
  { title: '速查表', keys: [],
    desc: '恭喜完成！记住 <kbd>Ctrl</kbd>+<kbd>B</kbd> 加下面这些键就够日常使用了。想改键位，编辑 <code>~/.config/herdr/config.toml</code> 的 <code>[keys]</code> 段',
    apply: (s) => { s.overlay = { type: 'cheat' }; } },
];

// Precompute the state after each step so any step can be replayed.
const snaps = [];
{ let st = clone(s0); for (const step of STEPS) { step.apply(st); snaps.push(clone(st)); } }

// ---------- Rendering ----------
const $ = (id) => document.getElementById(id);
let seen = new Set();
let lastZoom = false;

function paneHTML(p, t, extra = '') {
  const cls = ['pane', p.id === t.focus ? 'focus' : '', seen.has(p.id) ? '' : 'new', extra].join(' ');
  return `<div class="${cls}"><div class="ph">${p.cmd}</div><div class="pb">${p.lines.join('\n')}</div></div>`;
}
function nodeHTML(n, t) {
  if (n.t === 'p') return paneHTML(n, t);
  return `<div class="split ${n.dir}">${n.kids.map((k) => nodeHTML(k, t)).join('')}</div>`;
}
function overlayHTML(s) {
  const o = s.overlay;
  if (!o) return '';
  if (o.type === 'picker') {
    return `<div class="overlay"><div class="modal"><div class="mt">Workspaces</div>${s.ws.map((w, i) => `<div class="mi ${i === o.sel ? 'sel' : ''}">${i + 1}  ${w.name}</div>`).join('')}</div></div>`;
  }
  if (o.type === 'help' || o.type === 'cheat') {
    const title = o.type === 'help' ? 'Keybindings · prefix = Ctrl+B' : '速查表 · 先按 Ctrl+B，再按';
    return `<div class="overlay"><div class="modal"><div class="mt">${title}</div><div class="cheat">${CHEAT.map(([k, v]) => `<span class="k">${k}</span><span>${v}</span>`).join('')}</div></div></div>`;
  }
  if (o.type === 'detached') {
    return `<div class="detached"><span class="a">~/code/snippet</span> <span class="m">$</span> herdr\n<span class="m">[detached]</span>\n<span class="a">~/code/snippet</span> <span class="m">$</span> ${o.typed}▍</div>`;
  }
  return '';
}
function render(s, ui = {}) {
  const w = curWs(s), t = curTab(s);
  $('sidebar').className = 'sidebar' + (s.sidebar ? '' : ' hidden');
  $('sidebar').innerHTML = '<div class="hd">WORKSPACES</div>' + s.ws.map((ws, i) => {
    const agents = ws.tabs.flatMap((tb) => allPanes(tb.root)).filter((p) => p.state);
    return `<div class="ws ${i === s.active ? 'active' : ''}"><span class="n">${i + 1}</span>${ws.name}</div>`
      + agents.map((p) => `<div class="agent"><span class="sd ${p.state}"></span>${p.cmd}</div>`).join('');
  }).join('');
  $('tabs').innerHTML = w.tabs.map((tb, i) => `<div class="tab ${i === w.tab ? 'active' : ''}">${tb.name}</div>`).join('');
  $('panes').innerHTML = t.zoom
    ? paneHTML(findPane(t.root, t.focus), t, lastZoom ? '' : 'zoomed')
    : nodeHTML(t.root, t);
  lastZoom = t.zoom;
  $('status').innerHTML = `<span class="mode ${ui.prefix ? 'prefix' : ''}">${ui.prefix ? 'PREFIX' : 'NORMAL'}</span>`
    + `<span>${w.name} · tab ${t.name}${t.zoom ? ' · <span class="y">ZOOM</span>' : ''}</span>`
    + `<span class="r">Ctrl+B ? 帮助</span>`;
  $('overlay').innerHTML = overlayHTML(s);
  for (const ws of s.ws) for (const tb of ws.tabs) for (const p of allPanes(tb.root)) seen.add(p.id);
}

const keyLabel = (g) => g.join('+');
function renderKeys(groups) {
  $('keys').innerHTML = groups.length
    ? groups.map((g, gi) => `<span class="grp" data-g="${gi}">${g.map((k) => `<span class="kc">${k}</span>`).join('<span class="plus">+</span>')}</span>`).join('<span class="then">然后</span>')
    : '<span class="nokey">本步无需按键</span>';
}
const grpEl = (gi) => $('keys').querySelector(`[data-g="${gi}"]`);

$('count').textContent = STEPS.length;
$('list').innerHTML = STEPS.map((st, i) => `<li data-i="${i}"><span class="t">${i + 1}. ${st.title}</span><span class="k">${st.keys.map(keyLabel).join(' → ')}</span></li>`).join('');

// ---------- Playback ----------
let cur = 0, playing = true, token = 0;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const isPrefix = (g) => g.length === 2 && g[0] === 'Ctrl' && g[1] === 'B';

function updateChrome(i) {
  const st = STEPS[i];
  $('caption').innerHTML = `<h2><span class="idx">${String(i + 1).padStart(2, '0')}</span>${st.title}</h2><p>${st.desc}</p>`;
  $('progress').style.width = `${((i + 1) / STEPS.length) * 100}%`;
  document.querySelectorAll('#list li').forEach((li) => li.classList.toggle('active', +li.dataset.i === i));
  $('play').textContent = playing ? '⏸ 暂停' : '▶ 播放';
}

async function run(i) {
  const my = ++token;
  const alive = () => my === token;
  cur = i;
  const step = STEPS[i];
  const work = clone(i ? snaps[i - 1] : s0);
  updateChrome(i);
  renderKeys(step.keys);
  render(work);
  await wait(700); if (!alive()) return;

  if (step.typeText) {
    for (const ch of step.typeText) {
      work.overlay.typed += ch; render(work);
      await wait(140); if (!alive()) return;
    }
    await wait(300); if (!alive()) return;
  }

  let prefix = false;
  for (let gi = 0; gi < step.keys.length; gi++) {
    const g = step.keys[gi];
    grpEl(gi).classList.add('down');
    await wait(260); if (!alive()) return;
    grpEl(gi).classList.replace('down', 'done');
    if (isPrefix(g)) prefix = true;
    else { prefix = false; step.during?.[gi]?.(work); }
    if (gi < step.keys.length - 1) { render(work, { prefix }); await wait(650); if (!alive()) return; }
  }

  render(snaps[i], { prefix: !!step.holdPrefix });
  await wait(step.keys.length ? 3200 : 3600); if (!alive()) return;
  if (playing && i < STEPS.length - 1) run(i + 1);
  else if (playing) { playing = false; updateChrome(i); }
}

$('prev').onclick = () => run(Math.max(0, cur - 1));
$('next').onclick = () => run(Math.min(STEPS.length - 1, cur + 1));
$('play').onclick = () => {
  playing = !playing;
  if (playing) run(cur === STEPS.length - 1 ? 0 : cur + 1);
  else updateChrome(cur);
};
$('list').onclick = (e) => { const li = e.target.closest('li'); if (li) run(+li.dataset.i); };
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') $('next').click();
  else if (e.key === 'ArrowLeft') $('prev').click();
  else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
});

run(0);
</script>
</body>
</html>
