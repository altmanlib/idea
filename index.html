<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>idea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300&display=swap" rel="stylesheet">
  <style>
    :root {
      --space: #03040a;
      --text: #e6e9ff;
      --caret: #8fa6ff;
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      background: var(--space);
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Vignette keeps the edges deep and the eye on the title */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.55) 100%);
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-family: "Oxanium", system-ui, sans-serif;
      font-weight: 300;
      font-size: clamp(2.75rem, 9vw, 7rem);
      line-height: 1;
      letter-spacing: 0.08em;
      /* Offset the caret width so the word itself sits at optical center */
      padding-left: 0.46em;
      text-shadow: 0 0 0.4em rgba(143, 166, 255, 0.35);
    }

    /* Blinking underscore caret: the idea is still being written */
    h1::after {
      content: "";
      display: inline-block;
      width: 0.42em;
      height: 0.06em;
      margin-left: 0.04em;
      background: var(--caret);
      box-shadow: 0 0 0.3em var(--caret);
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      h1::after { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <h1>idea</h1>

  <script>
    /*
     * Layered sky, back to front:
     *   1. nebula clouds along a galactic band (pre-rendered, slow drift + breathing)
     *   2. star layers at three depths (drift + pointer parallax + twinkle)
     *   3. occasional shooting stars
     */
    const canvas = document.getElementById("sky");
    const ctx = canvas.getContext("2d");
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const TAU = Math.PI * 2;
    const rand = (a, b) => a + Math.random() * (b - a);
    // Approximate gaussian, used to cluster stars around the galactic band
    const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;

    // Depth layers: farther layers are dimmer, smaller, slower, and move less with the pointer
    const LAYERS = [
      { drift: 2,  parallax: 6,  size: [0.2, 0.55], alpha: [0.2, 0.55], density: 1 / 1600 },
      { drift: 5,  parallax: 16, size: [0.4, 0.9],  alpha: [0.35, 0.75], density: 1 / 5200 },
      { drift: 10, parallax: 34, size: [0.8, 1.6],  alpha: [0.7, 1],    density: 1 / 26000 },
    ];
    const HUES = ["214, 224, 255", "214, 224, 255", "214, 224, 255", "255, 236, 214", "190, 210, 255"];

    let w = 0, h = 0, pad = 0;
    let stars = [];
    let nebula = null;
    let band = null;
    let meteors = [];
    let nextMeteor = 0;
    const pointer = { x: 0, y: 0, tx: 0, ty: 0 };

    // Pre-rendered glow sprite for bright stars, cheaper than per-frame gradients
    const glow = document.createElement("canvas");
    glow.width = glow.height = 64;
    {
      const g = glow.getContext("2d");
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, "rgba(255,255,255,0.9)");
      grad.addColorStop(0.15, "rgba(200,215,255,0.35)");
      grad.addColorStop(1, "rgba(200,215,255,0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 64);
    }

    function build() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      w = innerWidth;
      h = innerHeight;
      pad = 60; // extra field so parallax never reveals an empty edge
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Galactic band: a tilted line across the screen
      band = {
        cx: w * 0.5, cy: h * 0.5,
        angle: -0.42,
        width: Math.min(w, h) * 0.22,
      };
      const ux = Math.cos(band.angle), uy = Math.sin(band.angle);
      const span = Math.hypot(w, h) * 0.6;

      const fw = w + pad * 2, fh = h + pad * 2;
      stars = [];
      LAYERS.forEach((layer, depth) => {
        const count = Math.round(fw * fh * layer.density);
        for (let i = 0; i < count; i++) {
          stars.push(makeStar(depth, rand(0, fw), rand(0, fh)));
        }
      });
      // Dense dust of faint stars concentrated along the band
      const bandCount = Math.round((w * h) / 1100);
      for (let i = 0; i < bandCount; i++) {
        const along = rand(-span, span);
        const across = gauss() * band.width;
        const x = band.cx + ux * along - uy * across + pad;
        const y = band.cy + uy * along + ux * across + pad;
        stars.push(makeStar(0, x, y));
      }

      nebula = renderNebula(ux, uy, span);
    }

    function makeStar(depth, x, y) {
      const layer = LAYERS[depth];
      return {
        depth,
        x, y,
        r: rand(...layer.size),
        a: rand(...layer.alpha),
        hue: HUES[(Math.random() * HUES.length) | 0],
        speed: rand(0.3, 1.6),
        phase: rand(0, TAU),
      };
    }

    function renderNebula(ux, uy, span) {
      const off = document.createElement("canvas");
      const fw = w + pad * 4, fh = h + pad * 4;
      off.width = fw;
      off.height = fh;
      const g = off.getContext("2d");
      g.globalCompositeOperation = "lighter";
      const palette = [
        [92, 70, 190],   // indigo violet
        [40, 92, 170],   // deep sky blue
        [24, 120, 140],  // teal
        [150, 70, 150],  // faint magenta
      ];
      const clouds = Math.round(18 + (w * h) / 90000);
      for (let i = 0; i < clouds; i++) {
        const along = rand(-span, span) * 0.9;
        const across = gauss() * band.width * 1.3;
        const x = band.cx + ux * along - uy * across + pad * 2;
        const y = band.cy + uy * along + ux * across + pad * 2;
        const r = rand(0.12, 0.32) * Math.max(w, h);
        const [cr, cg, cb] = palette[(Math.random() * palette.length) | 0];
        const a = rand(0.04, 0.1);
        const grad = g.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, `rgba(${cr},${cg},${cb},${a})`);
        grad.addColorStop(0.5, `rgba(${cr},${cg},${cb},${a * 0.4})`);
        grad.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
        g.fillStyle = grad;
        g.fillRect(x - r, y - r, r * 2, r * 2);
      }
      // Dark dust lane through the middle of the band
      g.globalCompositeOperation = "source-over";
      for (let i = 0; i < 10; i++) {
        const along = rand(-span, span) * 0.8;
        const across = gauss() * band.width * 0.25;
        const x = band.cx + ux * along - uy * across + pad * 2;
        const y = band.cy + uy * along + ux * across + pad * 2;
        const r = rand(0.05, 0.12) * Math.max(w, h);
        const grad = g.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, "rgba(3,4,10,0.35)");
        grad.addColorStop(1, "rgba(3,4,10,0)");
        g.fillStyle = grad;
        g.fillRect(x - r, y - r, r * 2, r * 2);
      }
      return off;
    }

    function spawnMeteor(now) {
      // Enter from the upper area, travel down-left or down-right
      const dir = Math.random() < 0.5 ? -1 : 1;
      const angle = dir < 0 ? rand(2.4, 2.8) : rand(0.35, 0.75);
      const speed = rand(700, 1200);
      meteors.push({
        x: rand(w * 0.15, w * 0.85),
        y: rand(-20, h * 0.35),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        len: rand(120, 240),
        born: now,
        life: rand(0.7, 1.2),
      });
      nextMeteor = now + rand(3.5, 9);
    }

    function wrap(v, size) {
      return ((v % size) + size) % size;
    }

    let last = 0;
    function draw(t) {
      const now = t / 1000;
      const dt = Math.min(now - last, 0.05);
      last = now;

      // Ease pointer toward its target for smooth parallax
      pointer.x += (pointer.tx - pointer.x) * 0.04;
      pointer.y += (pointer.ty - pointer.y) * 0.04;

      ctx.clearRect(0, 0, w, h);

      // 1. Nebula: slow breathing and a gentle lissajous drift
      const nx = -pad * 2 + Math.sin(now * 0.03) * 18 - pointer.x * 4;
      const ny = -pad * 2 + Math.cos(now * 0.025) * 12 - pointer.y * 4;
      ctx.globalAlpha = still ? 1 : 0.85 + 0.15 * Math.sin(now * 0.2);
      ctx.drawImage(nebula, nx, ny);
      ctx.globalAlpha = 1;

      // 2. Stars
      const fw = w + pad * 2, fh = h + pad * 2;
      for (const s of stars) {
        const layer = LAYERS[s.depth];
        const x = wrap(s.x - now * layer.drift, fw) - pad - pointer.x * layer.parallax;
        const y = s.y - pad - pointer.y * layer.parallax;
        if (x < -4 || x > w + 4 || y < -4 || y > h + 4) continue;
        const tw = still ? 1 : 0.6 + 0.4 * Math.sin(now * s.speed + s.phase);
        const alpha = s.a * tw;
        if (s.depth === 2) {
          const size = s.r * 10;
          ctx.globalAlpha = alpha * 0.8;
          ctx.drawImage(glow, x - size / 2, y - size / 2, size, size);
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = `rgba(${s.hue},${alpha})`;
        if (s.r < 0.6) {
          ctx.fillRect(x, y, s.r * 2, s.r * 2);
        } else {
          ctx.beginPath();
          ctx.arc(x, y, s.r, 0, TAU);
          ctx.fill();
        }
      }

      // 3. Shooting stars
      if (!still) {
        if (now > nextMeteor) spawnMeteor(now);
        meteors = meteors.filter((m) => now - m.born < m.life);
        for (const m of meteors) {
          m.x += m.vx * dt;
          m.y += m.vy * dt;
          const p = (now - m.born) / m.life;
          const fade = Math.sin(p * Math.PI); // fade in then out
          const mag = Math.hypot(m.vx, m.vy);
          const tx = m.x - (m.vx / mag) * m.len;
          const ty = m.y - (m.vy / mag) * m.len;
          const grad = ctx.createLinearGradient(m.x, m.y, tx, ty);
          grad.addColorStop(0, `rgba(235,240,255,${0.9 * fade})`);
          grad.addColorStop(1, "rgba(235,240,255,0)");
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.4;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(m.x, m.y);
          ctx.lineTo(tx, ty);
          ctx.stroke();
          ctx.globalAlpha = fade;
          ctx.drawImage(glow, m.x - 8, m.y - 8, 16, 16);
          ctx.globalAlpha = 1;
        }
        requestAnimationFrame(draw);
      }
    }

    // Pointer parallax, normalized to [-1, 1] from screen center
    addEventListener("pointermove", (e) => {
      pointer.tx = (e.clientX / w) * 2 - 1;
      pointer.ty = (e.clientY / h) * 2 - 1;
    });

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        build();
        if (still) draw(0);
      }, 150);
    });

    build();
    if (still) {
      draw(0);
    } else {
      nextMeteor = rand(1.5, 3);
      requestAnimationFrame((t) => { last = t / 1000; draw(t); });
    }
  </script>
</body>
</html>
